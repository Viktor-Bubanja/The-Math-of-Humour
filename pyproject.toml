[project]
name = "humour"
version = "0.1.0"
description = "Measuring jokes with language-model surprisal"
requires-python = ">=3.11"
# Pinned to the versions the published results were produced with.
dependencies = [
    "torch==2.12.0",
    "transformers==5.12.0",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "matplotlib==3.11.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["humour"]
